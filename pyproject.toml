[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencescene"
version = "2.0.0"
description = "EvidenceScene: Observability-Conditioned 3D Scene Reconstruction for Robot Manipulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Tiwater Research, Tiwater" }
]
keywords = [
    "6D-pose-tracking",
    "3D-scene-reconstruction",
    "3D-surface-reconstruction",
    "teleoperation",
    "factor-graph-observability",
    "BundleTrack",
    "revisable-surfel-map",
    "SAM2",
    "RGB-D",
    "robotic-manipulation",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
]
test = [
    "pytest>=8.0.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
]

[project.scripts]
evidencescene = "evidencescene.cli:main"

[project.urls]
Homepage = "https://tiwater.github.io/evidencescene/"
Repository = "https://github.com/tiwater/evidencescene"
Documentation = "https://tiwater.github.io/evidencescene/"
Paper = "https://tiwater.github.io/evidencescene/assets/papers/evidencescene-monograph.pdf"

[tool.setuptools.packages.find]
include = ["evidencescene*"]

[tool.setuptools.package-data]
evidencescene = ["py.typed"]
