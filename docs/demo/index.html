<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="EvidenceScene Interactive 3D Workspace & 4-Camera RGB-D Replay Viewer">
  <title>EvidenceScene — Interactive 3D Workspace Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="demo-topbar">
    <div class="demo-brand">
      <a href="../" class="demo-title">EvidenceScene</a>
      <span class="demo-badge">DEMO</span>
    </div>
    <nav class="demo-nav">
      <a href="../" class="demo-link">← Home</a>
      <a href="../benchmark/" class="demo-link">Benchmarks</a>
      <a href="../assets/papers/evidencescene-short.pdf" class="demo-link" target="_blank" rel="noopener">Paper</a>
      <a href="https://github.com/tiwater/evidencescene" class="demo-link demo-link-primary" target="_blank" rel="noopener">Code</a>
    </nav>
  </header>

  <main id="demo-scene3d" class="demo-stage">
    <!-- Left Strip: 4 Full-Bleed 16:9 Camera Feeds with In-Frame Overlay Badges -->
    <aside class="cam-strip">
      <div class="cam-tile">
        <canvas data-cam-canvas="head"></canvas>
        <div class="cam-overlay-pill">
          <strong>HEAD</strong>
          <span data-cam-caption="head">+0.06 ms</span>
        </div>
      </div>
      <div class="cam-tile">
        <canvas data-cam-canvas="chest"></canvas>
        <div class="cam-overlay-pill">
          <strong>CHEST</strong>
          <span data-cam-caption="chest">0.00 ms</span>
        </div>
      </div>
      <div class="cam-tile">
        <canvas data-cam-canvas="left_arm"></canvas>
        <div class="cam-overlay-pill cam-overlay-ctx">
          <strong>L-WRIST</strong>
          <span data-cam-caption="left_arm">+33.27 ms</span>
        </div>
      </div>
      <div class="cam-tile">
        <canvas data-cam-canvas="right_arm"></canvas>
        <div class="cam-overlay-pill">
          <strong>R-WRIST</strong>
          <span data-cam-caption="right_arm">-0.01 ms</span>
        </div>
      </div>
      <video data-scene3d-video src="../assets/scene3d/cameras_4view_sync.mp4" muted loop playsinline preload="auto" style="display:none"></video>
    </aside>

    <!-- Right 3D WebGL Canvas (Full-Height, ~74% Width) with All Controls Inside the Canvas -->
    <section class="viewport-pane">
      <canvas class="scene3d-canvas" data-scene3d-canvas></canvas>

      <!-- Top-Left Floating Overlay: Compact Pour Alignment Reticle -->
      <div class="scene3d-assist-hud">
        <svg class="scene3d-reticle-svg" viewBox="-46 -46 92 92" aria-hidden="true">
          <circle cx="0" cy="0" r="40" fill="#090d12" stroke="#263340" stroke-width="1" stroke-dasharray="2 2"></circle>
          <line x1="-42" y1="0" x2="42" y2="0" stroke="#1e293b" stroke-width="1"></line>
          <line x1="0" y1="-42" x2="0" y2="42" stroke="#1e293b" stroke-width="1"></line>
          <circle data-hud-ring cx="0" cy="0" r="20" fill="rgba(16,185,129,0.16)" stroke="#10b981" stroke-width="1.5"></circle>
          <line data-hud-line x1="0" y1="0" x2="4" y2="5" stroke="#10b981" stroke-width="1.4"></line>
          <circle data-hud-dot cx="4" cy="5" r="3.5" fill="#10b981" stroke="#090d12" stroke-width="1"></circle>
        </svg>
        <div class="scene3d-assist-body">
          <div class="scene3d-assist-title" data-hud-title data-state="aligned">● POUR ALIGNED (+28.3 mm)</div>
          <div data-hud-row1>ΔXY <strong>14.5</strong>/42.8mm · ΔZ <strong>+37.7mm</strong> · <strong>63.2°</strong></div>
        </div>
      </div>

      <!-- Top-Right Floating Overlay: Viewpoint & Layer Dock + XYZ Triad -->
      <div class="viewport-top-right">
        <div class="floating-dock">
          <div class="dock-group">
            <span class="dock-label">View</span>
            <button type="button" class="scene3d-chip is-active" data-view-preset="orbit" aria-pressed="true">Orbit</button>
            <button type="button" class="scene3d-chip" data-view-preset="iso">Iso</button>
            <button type="button" class="scene3d-chip" data-view-preset="pour">Pour</button>
            <button type="button" class="scene3d-chip" data-view-preset="top">Top</button>
            <button type="button" class="scene3d-chip" data-view-preset="side">Side</button>
          </div>
          <span class="dock-sep"></span>
          <div class="dock-group">
            <span class="dock-label">Layers</span>
            <button type="button" class="scene3d-chip is-active" data-layer-toggle="prior" aria-pressed="true" title="Stage-0 Preparation Prior (SAM 3D 360° Complete Object Mesh + Sim(3) Depth Anchor)">SAM3D Prior</button>
            <button type="button" class="scene3d-chip is-active" data-layer-toggle="robot" aria-pressed="true">Robot</button>
            <button type="button" class="scene3d-chip is-active" data-layer-toggle="carton" aria-pressed="true">Carton</button>
            <button type="button" class="scene3d-chip is-active" data-layer-toggle="cup" aria-pressed="true">Cup</button>
            <button type="button" class="scene3d-chip is-active" data-layer-toggle="table" aria-pressed="true">Table</button>
            <button type="button" class="scene3d-chip is-active" data-layer-toggle="hud" aria-pressed="true">HUD</button>
          </div>
        </div>

        <svg class="scene3d-orient-svg" data-scene3d-orient viewBox="0 0 80 80" aria-label="3D Coordinate Frame">
          <g fill="#f87171" stroke="#f87171"><line x1="40" y1="40" x2="64" y2="40" stroke-width="1.6"></line><text x="70" y="40" stroke="none" text-anchor="middle" dominant-baseline="central">X</text></g>
          <g fill="#34d399" stroke="#34d399"><line x1="40" y1="40" x2="40" y2="16" stroke-width="1.6"></line><text x="40" y="10" stroke="none" text-anchor="middle" dominant-baseline="central">Y</text></g>
          <g fill="#60a5fa" stroke="#60a5fa"><line x1="40" y1="40" x2="24" y2="56" stroke-width="1.6"></line><text x="18" y="62" stroke="none" text-anchor="middle" dominant-baseline="central">Z</text></g>
          <circle cx="40" cy="40" r="2.2" fill="#cbd5e1"></circle>
        </svg>
      </div>

      <!-- Bottom Floating Overlay: Timeline Scrubber Inside the 3D Viewport -->
      <div class="viewport-bottom-dock">
        <button type="button" class="scene3d-play-btn" data-scene3d-play>⏸ Pause</button>
        <input type="range" class="scene3d-scrubber" data-scene3d-scrubber min="0" max="167" value="92" aria-label="3D Replay Timeline" />
        <span class="dock-mono" data-scene3d-timecode>20.7s / 33.1s</span>
        <span class="dock-mono dock-muted" data-scene3d-frame>F276/498</span>
        <span class="dock-mono dock-accent" data-scene3d-pts>11,133 surfels · 33.1 FPS</span>
      </div>
    </section>
  </main>

  <script type="module">
    import { initScene3DViewer } from '../assets/js/scene3d-viewer.js';
    initScene3DViewer(document.getElementById('demo-scene3d'), {
      assetBase: '../assets/scene3d',
      autoOrbit: true,
      autoPlay: true,
      initialFrame: 92,
      compactHud: true
    });
  </script>
</body>
</html>
