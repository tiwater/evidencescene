name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-package:
    name: Standalone Test & Package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
      - name: Run standalone test suite
        run: python -m pytest tests/ -v
      - name: Run end-to-end CLI demonstration & receipt verification
        run: |
          evidencescene info
          evidencescene demo --frames 18
          python benchmarks/performance/bench_suite.py --quick
          python benchmarks/sequence_summary.py
          python benchmarks/generate_table.py
          python benchmarks/generate_generated_mask_table.py
      - name: Build wheel and sdist
        run: |
          python -m build
          ls -lh dist/
